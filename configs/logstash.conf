# configs/logstash.conf
# Ships GeoIDS NDJSON alert file → Elasticsearch

input {
  file {
    path  => "/var/log/geoIDS/alerts.json"
    start_position => "beginning"
    sincedb_path   => "/dev/null"
    codec => "json"
    tags  => ["geoIDS"]
  }
}

filter {
  # Parse ISO timestamp if present
  date {
    match => ["timestamp", "UNIX"]
    target => "@timestamp"
  }

  # Add geo-IP enrichment for src IP (requires GeoLite2 db)
  # geoip { source => "src_ip" }

  # Tag severity based on confidence
  if [confidence] >= 0.8 {
    mutate { add_tag => ["high_severity"] }
  } else if [confidence] >= 0.5 {
    mutate { add_tag => ["medium_severity"] }
  } else {
    mutate { add_tag => ["low_severity"] }
  }
}

output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    index    => "geoIDS-alerts-%{+YYYY.MM.dd}"
    document_id => "%{flow_id}_%{[timestamp]}"
  }

  # Also print to stdout for debugging
  # stdout { codec => rubydebug }
}
