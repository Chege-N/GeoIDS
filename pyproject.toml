[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "geoIDS"
version = "0.1.0"
description = "Hyperdimensional Anomaly Detection for Zero-Day Exploits using Geometric Algebra"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "GeoIDS Contributors" }]
keywords = ["intrusion-detection", "geometric-algebra", "network-security", "anomaly-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "scapy>=2.5",
    "dpkt>=1.9",
    "nfstream>=6.5",
    "click>=8.1",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "websockets>=12.0",
    "plotly>=5.18",
    "dash>=2.14",
    "dash-cytoscape>=0.3",
    "pandas>=2.1",
    "rich>=13.0",
    "loguru>=0.7",
    "orjson>=3.9",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "hypothesis>=6.88",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.6",
    "pre-commit>=3.5",
]
benchmark = [
    "pytest-benchmark>=4.0",
    "memory-profiler>=0.61",
]

[project.scripts]
geoIDS = "geoidslib.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["geoidslib*", "dashboard*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q"
